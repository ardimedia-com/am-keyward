name: Release

# Tag-driven release. Push a v* tag (e.g. v0.1.0-preview) on a release-prep commit that has already promoted
# the matching "## [<version>]" CHANGELOG section. The job builds + tests, packs the libraries and pushes
# them to nuget.org via Trusted Publishing (OIDC — no long-lived API key), then publishes a GitHub Release
# whose notes ARE that CHANGELOG section. A second job attaches the MCP server as one self-contained program per
# platform (amkeyward-mcp-<rid>) to that release.
# Setup (once): create a Trusted Publishing policy on nuget.org for this repo + workflow, and set the repo
# Actions variable NUGET_USER to the nuget.org account username that owns the policy. No secret needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # OIDC token for NuGet Trusted Publishing

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        shell: bash
        run: |
          # The full tag (minus the leading 'v') IS the package version, e.g. 0.1.0-preview.
          echo "TAG_LABEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Fail fast (before the build) if a tagged release has no matching CHANGELOG section, so a forgotten
      # promotion blocks the release instead of publishing stale notes.
      - name: Verify CHANGELOG has an entry for this release
        shell: bash
        run: |
          if ! grep -qF "## [${TAG_LABEL}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG_LABEL}]' section. Promote [Unreleased] to '## [${TAG_LABEL}] - <date>' before tagging."
            exit 1
          fi
          echo "CHANGELOG.md has a section for ${TAG_LABEL}."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Am.Keyward.slnx

      - name: Build
        run: dotnet build Am.Keyward.slnx -c Release --no-restore -p:Version=${{ env.TAG_LABEL }}

      # Integration tests skip (Inconclusive) when no SQL Server is reachable, so this stays green on CI.
      - name: Test
        run: dotnet test Am.Keyward.slnx -c Release --no-build

      # Pack the publishable libraries (the shell app + tests set IsPackable=false) and push to nuget.org.
      # Symbol packages (.snupkg) are pushed alongside automatically. --skip-duplicate makes a re-run safe.
      - name: Pack
        run: dotnet pack Am.Keyward.slnx -c Release --no-build -p:Version=${{ env.TAG_LABEL }} -o artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived, single-use nuget.org API key.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          # dotnet nuget push doesn't expand a wildcard path itself, so let bash expand it and push each
          # package (the matching .snupkg symbol package is pushed alongside automatically).
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Mark pre-1.0 (0.x) and alpha/beta/rc/preview tags as prereleases.
          IS_PRERELEASE=""
          if echo "$TAG_LABEL" | grep -qE "^0\.|alpha|beta|rc|preview"; then
            IS_PRERELEASE="--prerelease"
          fi

          # Release notes are the matching CHANGELOG section: the body between "## [<version>]" and the next
          # "## [" header. The guard above guarantees it exists.
          awk -v ver="## [${TAG_LABEL}]" 'index($0, ver) == 1 { f = 1; next } /^## \[/ { if (f) exit } f { print }' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            NOTES_ARG=(--notes-file RELEASE_NOTES.md)
          else
            NOTES_ARG=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "AM KEYWARD $TAG_LABEL" \
            "${NOTES_ARG[@]}" \
            $IS_PRERELEASE

  # The MCP server as one self-contained program per platform, attached to the GitHub Release — for computers
  # without the .NET SDK (decision T10 A). macOS builds on a macOS runner: only there does the SDK sign the
  # program (ad hoc), without which Apple Silicon refuses to start it.
  #
  # Windows programs are Authenticode-signed with Azure Artifact Signing (decision T14 A, the Ardimedia standard —
  # see D:\CODE\.claude\code-signing.md) through OIDC: no secret on the runner. The step runs once the repository
  # variable ARTIFACT_SIGNING_ACCOUNT is set; until then the release still ships, unsigned. Setup (once):
  #   - Artifact Signing account + validated identity + certificate profile (public trust) in Azure;
  #   - an Entra app registration with a federated credential for
  #     repo:ardimedia-com/am-keyward:environment:code-signing and the role
  #     «Artifact Signing Certificate Profile Signer» on the certificate profile;
  #   - repository secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and variables
  #     ARTIFACT_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net/), ARTIFACT_SIGNING_ACCOUNT,
  #     ARTIFACT_SIGNING_PROFILE.
  mcp-binaries:
    needs: release
    environment: code-signing
    strategy:
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish amkeyward-mcp (${{ matrix.rid }})
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Am.Keyward.Mcp -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version="$VERSION" -o publish
          mkdir -p sign dist
          case "${{ matrix.rid }}" in
            win-*)
              mv publish/Am.Keyward.Mcp.exe "sign/amkeyward-mcp-${{ matrix.rid }}.exe" ;;
            *)
              mv publish/Am.Keyward.Mcp publish/amkeyward-mcp
              chmod +x publish/amkeyward-mcp ;;
          esac

      - name: Azure login (OIDC, for signing)
        if: startsWith(matrix.rid, 'win-') && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign amkeyward-mcp (Azure Artifact Signing)
        if: startsWith(matrix.rid, 'win-') && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*)
              ASSET="amkeyward-mcp-${{ matrix.rid }}.exe"
              mv "sign/$ASSET" "dist/$ASSET" ;;
            *)
              # A tar keeps the executable bit; the program inside is called amkeyward-mcp.
              ASSET="amkeyward-mcp-${{ matrix.rid }}.tar.gz"
              tar -czf "dist/$ASSET" -C publish amkeyward-mcp ;;
          esac
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$ASSET"; else shasum -a 256 "$ASSET"; fi > "$ASSET.sha256")
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
